[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ganesh.musne", email = "ganesh.musne.8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cohere>=7.3.1",
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "instructor[google-genai]>=1.17.0",
    "langsmith>=0.14.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "torch",
    "uvicorn>=0.54.0",
]

[dependency-groups]
eval = [
    "langchain-google-genai>=4.4.0",
    "ragas>=0.3.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
